<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>계정 수정 - 크보피드</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="/css/all.min.css">
    <!-- Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="/js/constants.js"></script>
    <script src="/js/supabase-config.js"></script>
    <script src="/js/auth.js" defer></script>
</head>
<body data-page="myaccount">
    <div class="app-container">
        <!-- Main Content -->
        <main class="main-feed">
            <section class="account-edit-section">
                <div class="edit-header">
                    <h1 class="edit-title">계정 정보 수정</h1>
                </div>

                <form id="edit-profile-form" class="edit-form">
                    <div class="form-group">
                        <label for="edit-display-name">이름 (닉네임)</label>
                        <input type="text" id="edit-display-name" class="auth-input" placeholder="이름 입력" required>
                    </div>

                    <div class="form-group">
                        <label for="edit-username">핸들 (아이디)</label>
                        <div class="handle-input-wrapper" style="position: relative;">
                            <span style="position: absolute; left: 16px; top: 50%; transform: translateY(-50%); color: var(--text-secondary); font-size: 17px;">@</span>
                            <input type="text" id="edit-username" class="auth-input" style="padding-left: 36px;" placeholder="username" required>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="edit-bio">자기소개</label>
                        <textarea id="edit-bio" class="auth-input" style="height: 100px; resize: none; padding-top: 12px;" placeholder="나를 표현해보세요."></textarea>
                    </div>

                    <div class="edit-actions" style="margin-top: 30px; display: flex; gap: 12px;">
                        <button type="button" class="auth-back-btn" style="flex: 1; background: #eee; color: #333;" onclick="history.back()">취소</button>
                        <button type="submit" class="auth-submit-btn" style="flex: 2;">저장하기</button>
                    </div>
                </form>
            </section>
        </main>
    </div>

    <style>
        .account-edit-section {
            padding: 20px;
            max-width: 600px;
            margin: 0 auto;
        }
        .edit-header {
            margin-bottom: 30px;
            padding-bottom: 15px;
            border-bottom: 1px solid var(--border-color);
        }
        .edit-title {
            font-size: 20px;
            font-weight: 800;
        }
        .form-group {
            margin-bottom: 20px;
        }
        .form-group label {
            display: block;
            font-size: 14px;
            font-weight: 700;
            margin-bottom: 8px;
            color: var(--text-primary);
        }
    </style>

    <script src="js/ui.js" defer></script>
    <script src="js/myaccount.js" defer></script>
    <script src="js/app.js" defer></script>
</body>
</html>

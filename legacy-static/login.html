<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>로그인 - 크보피드</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="/css/all.min.css">
    <!-- Supabase & Auth -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" crossorigin="anonymous"></script>
    <script src="/js/constants.js"></script>
    <script src="/js/supabase-config.js"></script>
    <script src="/js/auth.js" defer></script>
</head>
<body class="auth-page" data-page="login">
    <div class="auth-container">
        <div class="auth-header">
            <img src="images/logo.png" alt="크보피드" class="auth-logo">
            <h1>지금 크보피드에<br>로그인하세요</h1>
        </div>

        <div class="auth-box">
            <div class="social-auth">
                <button class="social-btn google" id="google-login-btn">
                    <img src="https://upload.wikimedia.org/wikipedia/commons/c/c1/Google_%22G%22_logo.svg" alt="Google">
                    Google 계정으로 로그인
                </button>
                <button class="social-btn kakao">
                    <img src="https://upload.wikimedia.org/wikipedia/commons/e/e3/KakaoTalk_logo.svg" alt="Kakao">
                    카카오톡으로 로그인
                </button>
            </div>

            <div class="auth-divider">
                <span>또는</span>
            </div>

            <form class="auth-form" id="login-form">
                <div class="form-group">
                    <input type="email" class="auth-input" id="login-email" placeholder="이메일 주소" required autocomplete="username">
                </div>
                <div class="form-group">
                    <input type="password" class="auth-input" id="login-password" placeholder="비밀번호" required autocomplete="current-password">
                </div>
                <button type="submit" class="auth-submit-btn" id="login-submit-btn">로그인</button>
            </form>

            <div class="auth-footer">
                <p>계정이 없으신가요? <a href="signup.html">가입하기</a></p>
            </div>
        </div>
    </div>
</body>
</html>
